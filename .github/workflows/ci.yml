name: Quant Macro & Seasonality CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 10 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with pytest
        run: |
          python -m pytest -v tests/

      - name: Run full quantitative pipeline
        run: |
          python -m src.main

      - name: Set up R (optional cross-validation)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Run R statistical cross-validation
        continue-on-error: true
        run: |
          Rscript -e 'pkgs <- c("jsonlite", "sandwich", "lmtest"); inst <- pkgs[!pkgs %in% installed.packages()[,1]]; if(length(inst)>0) install.packages(inst, repos="https://cloud.r-project.org")'
          Rscript r_analytics/analytics_r_stats.R

      - name: Upload generated report and charts
        uses: actions/upload-artifact@v6
        with:
          name: macro-quant-outputs
          path: |
            output/
            *.png
